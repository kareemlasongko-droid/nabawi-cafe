name: CI (Node 22)

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests + OpenNext build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Siapkan Node dari .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verifikasi versi Node
        run: |
          node --version
          npm --version
          node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'

      - name: Pasang dependensi
        run: npm ci

      - name: Uji logika tanpa server
        run: |
          npm run uji:aturan
          npm run uji:jalur
          npm run uji:env
          npm run uji:menu
          npm run uji:kasir-kategori
          npm run uji:dapur

      - name: Periksa tipe TypeScript
        run: npx tsc --noEmit

      # Ini menjalankan next build di dalam OpenNext, lalu membangun bundel
      # Worker — sama dengan jalur build Cloudflare, tetapi tidak mengunggah
      # versi dan tidak membutuhkan rahasia deploy.
      - name: Bangun bundel OpenNext untuk Cloudflare
        run: npx opennextjs-cloudflare build
